<!DOCTYPE html>
<html lang="cs">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Maze</title>
	<link rel="stylesheet" href="maze.css">
</head>
<body>
	<section id="entrance" class="room">
		<div class="door door-hor door-top">
			<a href="#sword-room">
				<img class="door-closed" src="door-closed.png" alt="Zavřené dveře nahoru.">
				<img class="door-open" src="door-open.png" alt="Otevřené dveře nahoru.">
			</a>
		</div>
		<div class="door door-ver door-right">
			<a href="#fork">
				<img class="door-closed" src="door-closed.png" alt="Zavřené dveře doprava.">
				<img class="door-open" src="door-open.png" alt="Otevřené dveře doprava.">
			</a>
		</div>
	</section>
	<section id="sword-room" class="room">
		<div class="door door-hor door-bottom">
			<a href="#entrance">
				<img class="door-closed" src="door-closed.png" alt="Zavřené dveře down.">
				<img class="door-open" src="door-open.png" alt="Otevřené dveře down.">
			</a>
		</div>
		<div class="room-content">
			<div id="sword-padestal">
				
			</div>
		</div>
	</section>
	<section id="fork" class="room">
		<h1>Room 4</h1>
		<p>Go to <a href="#room1">room 1</a></p>
	</section>
	<section id="items">
		<p>Předměty: </p>
	</section>

	<section id="door-test" class="room">
		<div class="door door-hor door-top">
			<a href="#door-test">
				<img class="door-closed" src="door-closed.png" alt="Zavřené dveře nahoru.">
				<img class="door-open" src="door-open.png" alt="Otevřené dveře nahoru.">
			</a>
		</div>
		<div class="door door-hor door-bottom">
			<a href="#door-test">
				<img class="door-closed" src="door-closed.png" alt="Zavřené dveře down.">
				<img class="door-open" src="door-open.png" alt="Otevřené dveře down.">
			</a>
		</div>
		<div class="door door-ver door-left">
			<a href="#door-test">
				<img class="door-closed" src="door-closed.png" alt="Zavřené dveře doleva.">
				<img class="door-open" src="door-open.png" alt="Otevřené dveře doleva.">
			</a>
		</div>
		<div class="door door-ver door-right">
			<a href="#door-test">
				<img class="door-closed" src="door-closed.png" alt="Zavřené dveře doprava.">
				<img class="door-open" src="door-open.png" alt="Otevřené dveře doprava.">
			</a>
		</div>
	</section>

</body>
</html>
